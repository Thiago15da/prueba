name: Bozzetto — QA visual

on:
  push:
    paths:
      - "index.html"
      - "assets/bozzetto-mark.svg"
      - "tests/bozzetto-qa.mjs"
      - ".github/workflows/bozzetto-visual.yml"
  workflow_dispatch:

jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Run preview server
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 > /tmp/bozzetto-server.log 2>&1 &
          sleep 2
      - name: Desktop mobile and interaction verification
        run: node tests/bozzetto-qa.mjs
      - name: Save preview screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bozzetto-desktop-mobile
          path: test-results/
          if-no-files-found: ignore
